<title>Lately Prototype</title>

<style>
/* Layout concept: a phone-sized app on the left, a tuning panel (clock, numbers, live ranking) on the right.
   On a narrow screen the app fills the page and the panel opens from the gear. */
:root{
  --stage:#ECE5D8; --paper:#FAF7F2; --surface:#FFFFFF; --ink:#23201C; --muted:#6A645C;
  --line:#E6DFD3; --soft:#EFE9DF; --accent:#2E6F5E; --on-accent:#FFFFFF; --accent-soft:#DDEBE5;
  --danger:#B3402A; --danger-soft:#F6E1DB; --scrim:rgba(35,32,28,.45);
  --display:'Bricolage Grotesque','Figtree',system-ui,sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --stage:#0E0E0D; --paper:#171614; --surface:#1F1E1B; --ink:#F1EDE6; --muted:#A79F94;
    --line:#35322D; --soft:#2A2824; --accent:#63B89E; --on-accent:#0E1D18; --accent-soft:#1F3A31;
    --danger:#E5826C; --danger-soft:#3C231D; --scrim:rgba(0,0,0,.6); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --stage:#0E0E0D; --paper:#171614; --surface:#1F1E1B; --ink:#F1EDE6; --muted:#A79F94;
  --line:#35322D; --soft:#2A2824; --accent:#63B89E; --on-accent:#0E1D18; --accent-soft:#1F3A31;
  --danger:#E5826C; --danger-soft:#3C231D; --scrim:rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--stage);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stage{display:flex;gap:32px;justify-content:center;align-items:flex-start;padding-block:16px}
.phone{position:relative;width:390px;flex:none;height:min(844px,calc(100dvh - 32px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)));
  background:var(--paper);border:1px solid var(--line);border-radius:36px;overflow:hidden;display:flex;flex-direction:column;
  box-shadow:0 24px 60px -28px rgba(0,0,0,.45)}
.panel{width:430px;flex:none;max-height:min(844px,calc(100dvh - 32px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)));
  overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px}
@media (max-width:979px){
  .stage{padding-block:8px}
  .phone{width:100%;border-radius:22px;height:calc(100dvh - 16px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
}
.appbar{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 6px;min-height:58px}
.appbar h1{margin:0;font-family:var(--display);font-size:26px;font-weight:700;letter-spacing:-.01em}
.iconbtn{width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;padding:0}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:6px 18px 110px;min-height:0}
.nav{display:flex;border-top:1px solid var(--line);background:var(--surface);padding:6px 10px 10px;flex:none}
.navbtn{flex:1;height:52px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);font-size:12px;font-weight:600}
.navbtn[aria-current="page"]{color:var(--accent)}
.fab{position:absolute;left:50%;transform:translateX(-50%);bottom:84px;width:58px;height:58px;border-radius:29px;border:4px solid var(--paper);background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;padding:0;box-shadow:0 8px 20px -8px rgba(0,0,0,.5);z-index:5}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px}
.eyebrow{margin:0 0 6px;font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;align-items:center;gap:12px}
.avatar{flex:none;border-radius:50%;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700}
.name{font-family:var(--display);font-weight:700;letter-spacing:-.01em}
.tag{display:inline-block;background:var(--soft);border-radius:10px;padding:2px 10px;font-size:12px;font-weight:600;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
.btn{height:48px;border-radius:15px;border:1px solid var(--line);background:var(--surface);font-weight:600;padding:0 16px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary[disabled]{opacity:.45;cursor:not-allowed}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.sm{height:44px;font-weight:500}
.btn.full{width:100%}
.linkbtn{border:0;background:transparent;color:var(--accent);font-weight:600;min-height:44px;padding:0 4px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.slide{display:block;width:calc(100% - 24px);margin:0 12px;height:44px;accent-color:var(--accent);background:transparent}
.snaplabels{display:flex;justify-content:space-between;margin-top:-6px}
.snaplabels button{width:44px;min-height:44px;border:0;background:transparent;color:var(--muted);font-weight:500;padding:0;text-align:center}
.snaplabels button[aria-pressed="true"]{color:var(--ink);font-weight:700}
.quietrow{display:flex;border-top:1px solid var(--line);margin:14px -18px -18px}
.quiet{flex:1;min-height:50px;border:0;background:transparent;color:var(--muted);font-weight:500}
.quiet+.quiet{border-left:1px solid var(--line)}
.popwrap{position:relative}
.pop{position:absolute;right:0;bottom:56px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 28px -12px rgba(0,0,0,.4);overflow:hidden;z-index:6;min-width:180px}
.pop button{display:block;width:100%;text-align:left;min-height:48px;padding:0 16px;border:0;background:transparent;font-weight:500}
.pop button+button{border-top:1px solid var(--line)}
.chip{min-height:44px;padding:0 16px;border-radius:22px;border:1.5px solid transparent;background:var(--soft);font-weight:500}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.seg{display:flex;gap:4px;background:var(--soft);border-radius:16px;padding:4px}
.seg button{flex:1;min-height:44px;border-radius:12px;border:1px solid transparent;background:transparent;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--surface);border-color:var(--line);color:var(--ink);font-weight:600}
.check{display:flex;align-items:center;gap:12px;min-height:44px}
.check input{width:22px;height:22px;margin:0;accent-color:var(--accent);flex:none}
.done{text-decoration:line-through;color:var(--muted)}
.field{width:100%;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 12px}
.lbl{display:block;margin:12px 0 6px;font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.divider{height:1px;background:var(--line);margin:14px 0}
.strip{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:0 16px}
.strip .row{justify-content:space-between;min-height:46px}
.strip .row+.row{border-top:1px solid var(--line)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:6px 14px 4px;min-width:0}
.tile.wide{grid-column:1/-1}
.tile h3{margin:0;font-family:var(--display);font-size:16px;font-weight:700}
.tile .hd{display:flex;align-items:center;justify-content:space-between;min-height:44px}
.plus{width:44px;height:44px;margin-right:-12px;border:0;background:transparent;color:var(--accent);display:flex;align-items:center;justify-content:center;padding:0}
.ruled{height:44px;border-top:1px solid var(--line)}
.scrim.top{z-index:32}.sheet.top{z-index:33}
.slim{grid-column:1/-1;min-height:44px;border:1.5px dashed var(--line);border-radius:16px;background:transparent;color:var(--muted);font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px}
.swipe{position:relative;border-top:1px solid var(--line);overflow:hidden}
.swipe-bg{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700}
.swipe-bg .act{padding:0 16px;height:100%;display:flex;align-items:center}
.swipe-bg .del{background:var(--danger-soft);color:var(--danger)}
.swipe-row{position:relative;background:var(--surface);min-height:44px;display:flex;align-items:center;gap:10px;touch-action:pan-y;user-select:none;-webkit-user-select:none;transition:transform .18s ease}
.swipe-row.dragging{transition:none}
.swipe-row .txt{flex:1;min-width:0;overflow-wrap:anywhere;font-size:14.5px;padding:6px 0}
.edit-row{display:flex;align-items:center;gap:2px;padding-right:2px}
.edit-row .edit-input{flex:1;min-width:0;width:auto;border-top:0}
.iconbtn2{flex:none;width:40px;height:40px;border:0;background:transparent;color:var(--danger);display:flex;align-items:center;justify-content:center;border-radius:12px}
.chatrow{background:transparent;border:0;border-top:1px solid var(--line);color:inherit;font:inherit;cursor:pointer;border-radius:0}
.chevtag{display:flex;align-items:center;gap:6px;color:var(--muted)}
.edit-input{width:100%;min-height:44px;border:0;border-top:1px solid var(--line);background:var(--surface);padding:0 2px;outline:none;font-size:14.5px}
.scrim{position:absolute;inset:0;background:var(--scrim);z-index:20}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:94%;background:var(--paper);border-radius:28px 28px 0 0;z-index:21;display:flex;flex-direction:column;animation:rise .22s ease}
@keyframes rise{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.swipe-row{transition:none}}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 0;flex:none}
.sheet>.hd{display:flex;align-items:center;justify-content:space-between;padding:6px 18px 0;min-height:52px;flex:none}
.sheet>.hd h2{margin:0;font-family:var(--display);font-size:21px}
.sheet .body{overflow-y:auto;padding:0 18px 16px;min-height:0}
.sheet .ft{padding:10px 18px 18px;border-top:1px solid var(--line);flex:none}
.toast{position:absolute;left:14px;right:14px;bottom:84px;z-index:30;background:var(--ink);color:var(--paper);border-radius:14px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px}
.toast button{border:0;background:transparent;color:var(--accent-soft);font-weight:700;min-height:36px;padding:0 6px}
.fact{min-width:0}.fl{font-size:12px;color:var(--muted)}.fv{font-weight:500;overflow-wrap:anywhere}
.list .row{min-height:60px;border-top:1px solid var(--line);width:100%;background:transparent;border-left:0;border-right:0;border-bottom:0;text-align:left;padding:8px 0}
.list .row:first-child{border-top:0}
table.rank{width:100%;border-collapse:collapse;font-size:12.5px}
table.rank th{text-align:left;font-weight:600;color:var(--muted);padding:6px 6px 6px 0;border-bottom:1px solid var(--line);white-space:nowrap}
table.rank td{padding:7px 6px 7px 0;border-bottom:1px solid var(--line);white-space:nowrap}
table.rank tr.hero td{font-weight:700;color:var(--accent)}
.tw{overflow-x:auto}
.numgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.numgrid label{font-size:12px;color:var(--muted);display:block}
.numgrid input{width:100%;min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--paper);padding:0 8px}
.panel h2{margin:0 0 4px;font-family:var(--display);font-size:20px}
.panel h3{margin:18px 0 8px;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.try{margin:0;padding-left:18px;color:var(--muted);font-size:13.5px}
.try li{margin:3px 0}
.empty{padding:24px 8px;text-align:center;color:var(--muted)}
</style>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script>
/*LOGIC_START*/
var DAY=86400000;
var USER_TZ=(function(){try{return Intl.DateTimeFormat().resolvedOptions().timeZone||'UTC'}catch(e){return 'UTC'}})();
var GROUPS=[{id:'parents',name:'Parents'},{id:'siblings',name:'Siblings'},{id:'friends',name:'Friends'}];
var LEN_LABEL={quick:'Quick',catchup:'Catch-up',long:'Long'};
var DEPTH_LABEL={shallow:'Shallow',varied:'Varied',deep:'Deep'};
var TYPE_LABEL={person:'In person',call:'Call',text:'Text'};
var TUNE0={groupInterval:{parents:14,siblings:21,friends:30},lenMin:{quick:15,catchup:30,long:60},awakeStart:8,awakeEnd:22,snoozeDays:7,chip15Max:20,chip30Min:20,chipLongMin:50,lastN:5,dueFloor:0.6,chipPenalty:0.6,gapBoost:2,gapRatio:4,trustChats:5,historyDamp:0.6,expCap:90};
var CITIES=[['Lisbon','Europe/Lisbon'],['London','Europe/London'],['Berlin','Europe/Berlin'],['Madrid','Europe/Madrid'],['Paris','Europe/Paris'],['Athens','Europe/Athens'],['Istanbul','Europe/Istanbul'],['Cairo','Africa/Cairo'],['Nairobi','Africa/Nairobi'],['Lagos','Africa/Lagos'],['Johannesburg','Africa/Johannesburg'],['Dubai','Asia/Dubai'],['Mumbai','Asia/Kolkata'],['Bangkok','Asia/Bangkok'],['Manila','Asia/Manila'],['Singapore','Asia/Singapore'],['Tokyo','Asia/Tokyo'],['Seoul','Asia/Seoul'],['Perth','Australia/Perth'],['Sydney','Australia/Sydney'],['Auckland','Pacific/Auckland'],['Honolulu','Pacific/Honolulu'],['Anchorage','America/Anchorage'],['Los Angeles','America/Los_Angeles'],['Vancouver','America/Vancouver'],['Denver','America/Denver'],['Mexico City','America/Mexico_City'],['Chicago','America/Chicago'],['New York','America/New_York'],['Bogota','America/Bogota'],['Sao Paulo','America/Sao_Paulo']];
var STATUS_LABEL={ok:'',asleep:'Asleep',today:'Talked today',notdue:'Not due',skipped:'Skipped',snoozed:'Snoozed',archived:'Archived'};
var LAST_TALKED=[['A week',7],['Two weeks',14],['A month',30],['A few months',90],['Six months',180],['A year or more',360]];

function pad(n){return String(n).padStart(2,'0')}
function uid(){return Math.random().toString(36).slice(2,9)}
function hm(tz,ms){
  try{
    var parts=new Intl.DateTimeFormat('en-US',{timeZone:tz,hour:'numeric',minute:'numeric',hourCycle:'h23'}).formatToParts(ms);
    var H=0,M=0;
    parts.forEach(function(x){if(x.type==='hour')H=(+x.value)%24;if(x.type==='minute')M=+x.value});
    return {h:H,m:M};
  }catch(e){var d=new Date(ms);return {h:d.getHours(),m:d.getMinutes()}}
}
function clockStr(tz,ms){
  try{
    return new Intl.DateTimeFormat('en-US',{timeZone:tz,hour:'numeric',minute:'2-digit'}).format(ms).replace(/\s?(AM|PM)/i,function(m,a){return ' '+a.toLowerCase()});
  }catch(e){return ''}
}
function ymd(tz,ms){
  try{return new Intl.DateTimeFormat('en-CA',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit'}).format(ms)}
  catch(e){var d=new Date(ms);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
}
function cityOf(tz){return String(tz).split('/').pop().replace(/_/g,' ')}
function intervalOf(p,tune){return p.intervalOverride||tune.groupInterval[p.group]||30}
function lastChatAt(p,type){var m=0;p.chats.forEach(function(c){if((!type||c.type===type)&&c.at>m)m=c.at});return m}
function lastContactMs(p,now){var m=lastChatAt(p);return m||now-(p.estimate==null?180:p.estimate)*DAY}
function chatMinutes(c,tune){return c.duration>0?c.duration:(tune.lenMin[c.length]||30)}
function expectedInfo(p,tune,ratio){
  var n=p.chats.length,base=30;
  if(n){
    var last=p.chats.slice().sort(function(a,b){return b.at-a.at}).slice(0,tune.lastN);
    base=last.reduce(function(s,c){return s+chatMinutes(c,tune)},0)/last.length;
  }
  var r=ratio==null?1:ratio,boost=1;
  if(r>1)boost=1+(tune.gapBoost-1)*Math.min(1,(r-1)/Math.max(0.5,tune.gapRatio-1));
  var trust=Math.min(1,n/Math.max(1,tune.trustChats));
  var f=1+(boost-1)*(1-tune.historyDamp*trust);
  var m=Math.max(5,Math.min(tune.expCap,Math.round(base*f/5)*5));
  return {min:m,sure:n>=3&&f<1.15};
}
function statusOf(p,now,tune){
  if(p.archived)return 'archived';
  if(p.snoozedUntil&&p.snoozedUntil>now)return 'snoozed';
  if(p.skippedDay&&p.skippedDay===ymd(USER_TZ,now))return 'skipped';
  var lc=lastChatAt(p);
  if(lc&&ymd(USER_TZ,lc)===ymd(USER_TZ,now))return 'today';
  var t=hm(p.tz,now),mins=t.h*60+t.m;
  if(mins<tune.awakeStart*60||mins>=tune.awakeEnd*60)return 'asleep';
  return 'ok';
}
function rank(people,now,tune){
  var rows=people.filter(function(p){return !p.archived}).map(function(p){
    var last=lastContactMs(p,now),days=Math.max(0,(now-last)/DAY),iv=intervalOf(p,tune),ratio=days/iv;
    var st=statusOf(p,now,tune);
    if((st==='ok'||st==='asleep')&&ratio<tune.dueFloor)st='notdue';
    var info=expectedInfo(p,tune,ratio);
    return {p:p,days:days,iv:iv,ratio:ratio,status:st,exp:info.min,sure:info.sure};
  });
  rows.sort(function(a,b){
    var ao=a.status==='ok'?0:1,bo=b.status==='ok'?0:1;
    if(ao!==bo)return ao-bo;
    if(b.ratio!==a.ratio)return b.ratio-a.ratio;
    if(b.days!==a.days)return b.days-a.days;
    return a.p.name.localeCompare(b.p.name);
  });
  return rows;
}
function chipFits(chip,exp,tune){
  if(chip==='15')return exp<=tune.chip15Max;
  if(chip==='30')return exp>=tune.chip30Min;
  if(chip==='long')return exp>=tune.chipLongMin;
  return true;
}
function pickHero(rows,chip,tune){
  var ok=rows.filter(function(r){return r.status==='ok'});
  if(!ok.length)return {row:null,note:''};
  var best=null,bs=-1,bfit=true;
  ok.forEach(function(r){
    var fit=!chip||chipFits(chip,r.exp,tune),sc=r.ratio*(fit?1:tune.chipPenalty);
    if(sc>bs){bs=sc;best=r;bfit=fit}
  });
  var note='';
  if(chip&&!bfit)note=chip==='15'?'A quick hello still counts.':'Not a perfect fit for that, but they are the most due.';
  return {row:best,note:note};
}
function wakeInMin(p,now,tune){var t=hm(p.tz,now),cur=t.h*60+t.m,s=tune.awakeStart*60;return cur<s?s-cur:1440-cur+s}
function whyLine(r){
  var over=r.days-r.iv,a;
  if(over>=90)a='Overdue by '+Math.floor(over/30)+' months';
  else if(over>=14)a='Overdue by '+Math.floor(over/7)+' weeks';
  else if(over>=1)a='Overdue by '+Math.floor(over)+(Math.floor(over)===1?' day':' days');
  else if(over>-1)a='Due today';
  else a='Due in '+Math.ceil(-over)+(Math.ceil(-over)===1?' day':' days');
  a+=' · '+(r.sure?'usually':'probably')+' a '+r.exp+' minute '+(r.exp<=20?'check-in':r.exp<=45?'catch-up':'long chat');
  return a;
}
function agoText(days){
  if(days<1)return 'today';
  if(days<14)return Math.floor(days)+(Math.floor(days)===1?' day ago':' days ago');
  if(days<60)return Math.floor(days/7)+' weeks ago';
  return Math.floor(days/30)+' months ago';
}
function upcoming(people,now,limitDays){
  var t=ymd(USER_TZ,now).split('-').map(Number),today=Date.UTC(t[0],t[1]-1,t[2]),out=[];
  function add(label,sub,mmdd,pid){
    if(!mmdd)return;
    var m=/^(\d\d)-(\d\d)$/.exec(mmdd);
    if(!m)return;
    var c=Date.UTC(t[0],+m[1]-1,+m[2]);
    if(c<today)c=Date.UTC(t[0]+1,+m[1]-1,+m[2]);
    var days=Math.round((c-today)/DAY);
    if(days<=limitDays)out.push({label:label,sub:sub,days:days,at:c,pid:pid});
  }
  people.forEach(function(p){
    if(p.archived)return;
    add(p.name+"'s birthday",'',p.birthday,p.id);
    p.rels.forEach(function(f){add(f.name+"'s birthday",p.name+"'s "+(f.relation||'person'),f.birthday,p.id)});
  });

    else if(sheet.kind==='chat'){var cp=data.people.find(function(p){return p.id===sheet.pid});sheetEl=h(ChatSheet,{person:cp,chat:cp.chats.find(function(c){return c.id===sheet.cid}),now:now,custom:data.custom,onClose:function(){setSheet(null)}})}
    else if(sheet.kind==='edit'){var ep=data.people.find(function(p){return p.id===sheet.pid});sheetEl=h(EditPersonSheet,{key:ep.id,person:ep,tune:tune,now:now,onClose:function(){setSheet(null)},
      onSave:function(patch){ops.updatePerson(ep.id,patch);setSheet(null);say('Saved')},
      onArchive:function(){setSheet(null);ops.archive(ep.id)},onRestore:function(){setSheet(null);ops.restore(ep.id)},onDelete:function(){ops.deletePerson(ep.id)}})}
    else if(sheet.kind==='reach')sheetEl=h(ReachSheet,{person:data.people.find(function(p){return p.id===sheet.pid}),onClose:function(){setSheet(null)},onGo:goContact});
    else if(sheet.kind==='add')sheetEl=h(AddSheet,{tune:tune,now:now,onClose:function(){setSheet(null)},onCreate:createPerson});
    else if(sheet.kind==='rel'){var pp=data.people.find(function(p){return p.id===sheet.pid});sheetEl=h(RelSheet,{key:sheet.fid||'new',member:sheet.fid?pp.rels.find(function(f){return f.id===sheet.fid}):null,existing:pp.rels,onClose:function(){setSheet(null)},onPick:function(m){setSheet({kind:'rel',pid:sheet.pid,fid:m.id})},onSave:function(m){putRel(sheet.pid,m);setSheet(null)},onDelete:function(fid){ops.delRel(sheet.pid,fid);setSheet(null)}})}
    else if(sheet.kind==='tune')sheetEl=h(Sheet,{title:'Settings',onClose:function(){setSheet(null)}},h(Tune,{chip:chip,tune:tune,setTune:setTune,rows:rows,heroId:heroId,now:now,shift:shift,addShift:addShift,resetAll:resetAll,resetTune:resetTune}));
  }
  var showFab=!person&&(tab==='home'||tab==='people');
  var tabs=[['home','Home','home'],['people','People','people'],['dates','Dates','cal']];
  return div({className:'stage'},
    div({className:'phone'},
      person?null:div({className:'appbar'},h1(null,title),
        button({className:'iconbtn','aria-label':'Settings',onClick:function(){wide?say('In this prototype, settings are the panel on the right.'):setSheet({kind:'tune'})}},h(Icon,{n:'gear'}))),
      div({className:'scroll',ref:scrollRef,style:person?{paddingTop:12}:null},screen),
      nav({className:'nav','aria-label':'Main'},tabs.map(function(t){
        return button({key:t[0],className:'navbtn','aria-current':(!person&&tab===t[0])?'page':undefined,onClick:function(){setPid(null);setTab(t[0])}},h(Icon,{n:t[2]}),t[1]);
      })),
      showFab?button({className:'fab','aria-label':'Log a chat',onClick:function(){setSheet({kind:'log',id:null})}},h(Icon,{n:'chat',s:26,w:2})):null,
      sheetEl,
      toast?div({className:'toast',role:'status'},span(null,toast.msg),toast.action?button({onClick:toast.action.fn},toast.action.label):null):null),
    wide?div({className:'panel'},h(Tune,{chip:chip,tune:tune,setTune:setTune,rows:rows,heroId:heroId,now:now,shift:shift,addShift:addShift,resetAll:resetAll,resetTune:resetTune})):null);
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
})();
</script>
